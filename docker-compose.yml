# Aha Server - Docker Compose
# Infra services for development and production
#
# Usage:
#   docker compose up -d              # Start infra (pg + redis + minio)
#   docker compose up --build         # Start everything including app server
#
# The app server can run outside Docker while infra runs inside:
#   docker compose up -d postgres redis minio
#   yarn start

services:
    # ============================================
    # PostgreSQL Database
    # ============================================
    postgres:
        image: postgres:17-alpine
        container_name: aha-postgres
        restart: unless-stopped
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
            - POSTGRES_DB=aha
            - PGDATA=/var/lib/postgresql/data/pgdata
        volumes:
            - postgres-data:/var/lib/postgresql/data
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d aha"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - aha-network

    # ============================================
    # Redis (cache + event bus)
    # ============================================
    redis:
        image: redis:8-alpine
        container_name: aha-redis
        restart: unless-stopped
        command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        volumes:
            - redis-data:/data
        ports:
            - "${REDIS_PORT:-6379}:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - aha-network

    # ============================================
    # MinIO (S3-compatible object storage)
    # ============================================
    minio:
        image: minio/minio:latest
        container_name: aha-minio
        restart: unless-stopped
        command: server /data --console-address ":9001"
        environment:
            - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
            - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin}
        volumes:
            - minio-data:/data
        ports:
            - "${S3_PORT:-9000}:9000"
            - "9001:9001"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 30s
            timeout: 20s
            retries: 3
        networks:
            - aha-network

    # ============================================
    # Application Server (optional — can run outside Docker)
    # ============================================
    # app:
    #     build:
    #         context: .
    #         dockerfile: Dockerfile
    #     container_name: aha-server
    #     restart: unless-stopped
    #     ports:
    #         - "${PORT:-3005}:3005"
    #         - "${METRICS_PORT:-9090}:9090"
    #     environment:
    #         - NODE_ENV=production
    #         - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/aha?connection_limit=30
    #         - REDIS_URL=redis://redis:6379
    #         - HANDY_MASTER_SECRET=${HANDY_MASTER_SECRET:-your-secret-key}
    #         - PORT=3005
    #         - METRICS_ENABLED=${METRICS_ENABLED:-true}
    #         - METRICS_PORT=9090
    #         - S3_HOST=minio
    #         - S3_PORT=9000
    #         - S3_USE_SSL=false
    #         - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
    #         - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
    #         - S3_BUCKET=aha
    #         - S3_PUBLIC_URL=http://localhost:9000/aha
    #     depends_on:
    #         postgres:
    #             condition: service_healthy
    #         redis:
    #             condition: service_healthy
    #     networks:
    #         - aha-network

networks:
    aha-network:
        driver: bridge

volumes:
    postgres-data:
        driver: local
    redis-data:
        driver: local
    minio-data:
        driver: local
